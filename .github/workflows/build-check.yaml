name: Build Check
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          cache: false
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - name: Configure live diagnostics fingerprint
        env:
          DIAGNOSTICS_FINGERPRINT: ${{ secrets.DIAGNOSTICS_FINGERPRINT }}
        run: python3 .github/scripts/configure-diagnostics.py

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      # - name: Signing properties
      #   env:
      #     SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      #     SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      #     SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      #   run: |
      #     touch signing.properties
      #     echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
      #     echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
      #     echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties
      # Host-safe contract tests run from the real cfa module. The full native
      # package is Android-only, so diagnostics and controller processing use
      # explicit source sets; panel remains an ordinary package test.
      - name: Go unit tests
        id: go-tests
        if: success()
        working-directory: core/src/main/golang
        run: |
          go test ./native/diagnostics.go ./native/diagnostics_test.go
          go test \
            ./native/config/controller_access.go \
            ./native/config/process.go \
            ./native/config/process_test.go \
            ./native/config/override.go \
            ./native/config/defaults.go \
            ./native/config/provider.go \
            ./native/config/sentinel.go \
            ./native/config/panel.go
          go test ./native/config/panel/...

      # Unit-тесты на чистые считалки — ДО сборки приложения: они дешевле
      # (:core им нужен, а вот сборка APK, R8 и упаковка — нет), и красная
      # считалка не должна стоить полного прогона до фидбэка. В том же джобе,
      # а не отдельным: Go на :core тратится один раз на оба шага.
      #
      # Три модуля: :service (пороги напоминаний, разбор panel.json),
      # :core (упакованный счётчик трафика), :design (размеры, имена файлов
      # логов, проверки полей ввода).
      - name: Unit tests
        id: unit-tests
        if: success()
        run: >-
          ./gradlew --no-daemon -Pclod.abi=arm64-v8a
          service:testStandardDebugUnitTest
          core:testStandardDebugUnitTest
          design:testStandardDebugUnitTest

      - name: Verify release signing fails closed
        run: |
          set -euo pipefail
          tasks=$(mktemp)
          trap 'rm -f "$tasks"' EXIT
          ./gradlew --no-daemon -q app:tasks --all > "$tasks"
          if grep -Fq 'assembleStandardRelease' "$tasks"; then
            echo "::error::Unsigned application release variant is available"
            exit 1
          fi

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.unit-tests.outcome == 'failure' }}
        with:
          name: unit-test-report
          if-no-files-found: ignore
          # HTML — читать глазами, XML — машине: без него результат теста
          # виден только внутри архива.
          path: |
            service/build/reports/tests/
            service/build/test-results/
            core/build/reports/tests/
            core/build/test-results/
            design/build/reports/tests/
            design/build/test-results/

      - name: Build
        if: success()
        env:
          DIAGNOSTICS_ENDPOINT: ${{ vars.DIAGNOSTICS_ENDPOINT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: io.clodclash.app@${{ github.sha }}
        run: ./gradlew --no-daemon app:assembleStandardDebug -Pclod.abi=arm64-v8a

      # Один артефакт вместо четырёх: сборка идёт по одной ABI (-Pclod.abi=arm64-v8a),
      # flavor схлопнут в standard, тип debug. Прежние четыре шага указывали на
      # apk/alpha/release/* — этого каталога после ребрендинга не существует,
      # и артефакт не выкладывался вообще.
      - name: Upload Artifact (debug, arm64-v8a)
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: clodclash-debug-arm64-v8a
          if-no-files-found: error
          path: |
            app/build/outputs/apk/standard/debug/*arm64-v8a*.apk
